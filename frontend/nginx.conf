# Не пишем query string: OAuth callback содержит одноразовые code/state.
log_format safe_uri '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log safe_uri;

    # Docker DNS перечитывается после пересоздания backend без рестарта frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 300s;
    proxy_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/auth/hh/callback {
        # Upstream errors тоже могут содержать исходный URL с одноразовым кодом.
        access_log off;
        error_log /dev/null;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
