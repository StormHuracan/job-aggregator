[project]
name = "job-aggregator"
version = "0.1.0"
description = "Job aggregator backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12.0",
    "anyio>=4.0.0",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.118.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_aggregator"]