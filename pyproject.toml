[project]
name = "job-aggregator"
version = "0.1.0"
description = "Job aggregator backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12.0",
    "anyio>=4.0.0",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.118.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.10",
]

[tool.ruff]

target-version = "py314"
line-length = 88

[tool.ruff.lint]

select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
